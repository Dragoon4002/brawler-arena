- name: Deploy brawler server
  hosts: all
  become: true
  vars:
    repo_url: https://github.com/Dragoon4002/brawler-arena.git
    repo_version: main
    app_dir: /opt/brawler-arena
    compose: docker compose -f infra/compose.yml -f infra/compose.prod.yml
    # override with -e @secrets.yml (ansible-vault encrypted) or export in shell
    contract_id: "{{ lookup('env', 'CONTRACT_ID') }}"
    monsters_id: "{{ lookup('env', 'MONSTERS_ID') }}"
    referee_id: "{{ lookup('env', 'REFEREE_ID') }}"
    referee_key: "{{ lookup('env', 'REFEREE_KEY') }}"
    deb_arch: "{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }}"

  tasks:
    - name: Require domain
      ansible.builtin.assert:
        that: domain is defined and domain | length > 0

    # cargo release build OOMs on 2G RAM without it
    - name: Swapfile
      ansible.builtin.shell: |
        fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
        echo '/swapfile none swap sw 0 0' >> /etc/fstab
      args:
        creates: /swapfile

    - name: Base packages
      ansible.builtin.apt:
        name: [ca-certificates, curl, git]
        update_cache: true
        cache_valid_time: 3600

    - name: Docker apt repo
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_facts.distribution_release }}"
        components: stable
        architectures: "{{ deb_arch }}"
        signed_by: https://download.docker.com/linux/ubuntu/gpg

    - name: Docker engine + compose
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
        update_cache: true

    - name: Docker running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Repo checkout
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ repo_version }}"

    - name: Server env
      ansible.builtin.template:
        src: env.j2
        dest: "{{ app_dir }}/infra/.env"
        mode: "0600"
      no_log: true

    - name: Caddyfile
      ansible.builtin.template:
        src: Caddyfile.j2
        dest: "{{ app_dir }}/infra/Caddyfile"
        mode: "0644"
      notify: Restart caddy

    - name: Compose up
      ansible.builtin.command: "{{ compose }} up -d --no-build"
      args:
        chdir: "{{ app_dir }}"
      register: up
      changed_when: up.stderr is search('Recreated|Created|Started')

  handlers:
    # template swaps the file inode; the bind mount would keep serving the old one
    - name: Restart caddy
      ansible.builtin.command: "{{ compose }} restart caddy"
      args:
        chdir: "{{ app_dir }}"
      changed_when: true
