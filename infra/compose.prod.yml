# prod override: caddy terminates TLS, brawler-server stays internal
services:
  brawler-server:
    ports: !reset []

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [brawler-server]
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
